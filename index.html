<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Superdeportivo 3D</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
    #ui { position: absolute; top: 16px; left: 16px; color: #fff; }
    #ui p { margin: 0 0 8px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="ui"><p>Arrastra para girar · Rueda para acercar</p></div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(3.2, 1.2, 3.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.4));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6);
  sun.position.set(3, 5, 4);
  scene.add(sun);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.3, 0);
  controls.enableDamping = true;

  const paint = new THREE.MeshPhysicalMaterial({ color: 0x0a0a0a, metalness: 0.6, roughness: 0.25, clearcoat: 1 });
  const glass = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.1, metalness: 0.9 });
  const tire  = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
  const rim   = new THREE.MeshStandardMaterial({ color: 0x9a9a9a, metalness: 1, roughness: 0.3 });
  const light = new THREE.MeshStandardMaterial({ color: 0xffffcc, emissive: 0xffffaa, emissiveIntensity: 0.6 });

  const car = new THREE.Group();

  // Carrocería baja en forma de cuña
  const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.45, 1.5), paint);
  body.position.y = 0.4;
  car.add(body);

  // Cabina
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 1.2), glass);
  cabin.position.set(-0.2, 0.8, 0);
  car.add(cabin);

  // Morro inclinado
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.25, 1.4), paint);
  nose.position.set(1.8, 0.35, 0);
  nose.rotation.z = -0.25;
  car.add(nose);

  // Faros delanteros y traseros
  for (const z of [0.5, -0.5]) {
    const front = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.08, 0.3), light);
    front.position.set(2.3, 0.45, z);
    car.add(front);
    const back = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.4), new THREE.MeshStandardMaterial({ color: 0x990000, emissive: 0x330000 }));
    back.position.set(-1.8, 0.45, z);
    car.add(back);
  }

  // Ruedas
  const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.4, 32);
  wheelGeo.rotateX(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.22, 0.22, 0.42, 16);
  hubGeo.rotateX(Math.PI / 2);
  for (const [x, z] of [[1.3, 0.85], [1.3, -0.85], [-1.3, 0.85], [-1.3, -0.85]]) {
    const wheel = new THREE.Mesh(wheelGeo, tire);
    wheel.position.set(x, 0.0, z);
    const hub = new THREE.Mesh(hubGeo, rim);
    hub.position.copy(wheel.position);
    car.add(wheel, hub);
  }

  scene.add(car);

  // Suelo
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: 0x2a2a2a }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.42;
  scene.add(floor);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
