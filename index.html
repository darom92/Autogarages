<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deportivo blanco perlado</title>
  <style>
    body { margin: 0; overflow: hidden; background: #050505; font-family: sans-serif; }
    #ui { position: absolute; top: 16px; left: 16px; color: #ddd; font-size: 14px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="ui">Arrastra para girar · Rueda para acercar</div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  // Renderer con sombras y tonemapping cinematográfico
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050505);
  scene.fog = new THREE.Fog(0x050505, 14, 30);

  // Entorno de estudio para reflejos realistas en la pintura y los cristales
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

  // Iluminación de estudio
  const key = new THREE.SpotLight(0xffffff, 250, 0, Math.PI / 6, 0.4, 1.5);
  key.position.set(5, 8, 4);
  key.target.position.set(0, 0.5, 0);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.bias = -0.0005;
  scene.add(key, key.target);

  const rim = new THREE.DirectionalLight(0xaaccff, 1.2);
  rim.position.set(-5, 4, -6);
  scene.add(rim);

  // Suelo brillante y oscuro
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(40, 40),
    new THREE.MeshStandardMaterial({ color: 0x0b0b0c, roughness: 0.08, metalness: 0.3 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Materiales
  const pearl = new THREE.MeshPhysicalMaterial({
    color: 0xf4f4f7,
    metalness: 0.1,
    roughness: 0.22,
    clearcoat: 1,
    clearcoatRoughness: 0.04,
    iridescence: 0.25,
    iridescenceIOR: 1.3,
    iridescenceThicknessRange: [200, 400]
  });
  const carbon = new THREE.MeshPhysicalMaterial({ color: 0x111111, metalness: 0.2, roughness: 0.45, clearcoat: 0.6 });
  const glass  = new THREE.MeshPhysicalMaterial({ color: 0x0a0f14, metalness: 0.2, roughness: 0.02, transmission: 0.1, transparent: true, opacity: 0.85 });
  const tire   = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.85 });
  const rimBlk = new THREE.MeshPhysicalMaterial({ color: 0x151515, metalness: 0.9, roughness: 0.3, clearcoat: 0.5 });
  const ledW   = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 3 });
  const ledR   = new THREE.MeshStandardMaterial({ color: 0xff0022, emissive: 0xff0022, emissiveIntensity: 2 });

  const car = new THREE.Group();

  function add(geo, mat, x, y, z, rx = 0, rz = 0) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.rotation.set(rx, 0, rz);
    m.castShadow = true;
    m.receiveShadow = true;
    car.add(m);
    return m;
  }

  // Carrocería principal, baja y ancha
  add(new RoundedBoxGeometry(3.9, 0.5, 1.7, 4, 0.2), pearl, 0, 0.6, 0);

  // Morro en cuña
  add(new RoundedBoxGeometry(1.2, 0.36, 1.6, 4, 0.14), pearl, 1.95, 0.5, 0, 0, -0.18);

  // Cola más alta
  add(new RoundedBoxGeometry(1.1, 0.5, 1.6, 4, 0.16), pearl, -1.75, 0.8, 0, 0, 0.05);

  // Habitáculo acristalado
  add(new RoundedBoxGeometry(1.9, 0.5, 1.35, 6, 0.25), glass, -0.25, 1.1, 0);

  // Techo y arcos de carbono para contraste
  add(new RoundedBoxGeometry(1.6, 0.06, 1.2, 2, 0.02), carbon, -0.25, 1.38, 0);

  // Splitter delantero de fibra de carbono
  add(new THREE.BoxGeometry(0.5, 0.05, 1.9), carbon, 2.4, 0.25, 0);

  // Difusor trasero de carbono
  add(new THREE.BoxGeometry(0.5, 0.2, 1.7), carbon, -2.05, 0.3, 0);

  // Faldones laterales de carbono
  for (const z of [0.88, -0.88]) {
    add(new THREE.BoxGeometry(2.8, 0.1, 0.06), carbon, 0, 0.32, z);
  }

  // Faros LED finos (delanteros) y tiras LED traseras
  for (const z of [0.55, -0.55]) {
    add(new THREE.BoxGeometry(0.04, 0.06, 0.55), ledW, 2.22, 0.72, z, 0, -0.2);
    add(new THREE.BoxGeometry(0.04, 0.05, 0.6), ledR, -2.0, 0.85, z);
  }
  add(new THREE.BoxGeometry(0.04, 0.04, 1.2), ledR, -2.0, 0.8, 0);

  // Ruedas grandes con llantas negras
  const tireGeo = new THREE.CylinderGeometry(0.46, 0.46, 0.42, 48);
  tireGeo.rotateX(Math.PI / 2);
  const rimGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.44, 32);
  rimGeo.rotateX(Math.PI / 2);
  const hubGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.46, 16);
  hubGeo.rotateX(Math.PI / 2);

  for (const [x, z] of [[1.35, 0.92], [1.35, -0.92], [-1.4, 0.92], [-1.4, -0.92]]) {
    add(tireGeo, tire, x, 0.46, z);
    add(rimGeo, rimBlk, x, 0.46, z);
    add(hubGeo, carbon, x, 0.46, z);
  }

  car.position.y = 0;
  scene.add(car);

  // Cámara en ángulo de tres cuartos frontal
  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(4.6, 1.5, 4.2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.6, 0);
  controls.enableDamping = true;
  controls.minDistance = 4;
  controls.maxDistance = 12;
  controls.maxPolarAngle = Math.PI / 2 - 0.05;
  controls.update();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
  });
</script>
</body>
</html>
